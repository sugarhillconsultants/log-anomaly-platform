name: Log Anomaly Platform — Build, Test, Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r app/requirements.txt
          pip install pytest httpx
      - env:
          PYTHONPATH: app
        run: pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name ${{ vars.ACR_NAME }}
      - uses: docker/setup-buildx-action@v3
      - id: vars
        run: echo "image_tag=${{ vars.ACR_NAME }}.azurecr.io/log-anomaly-platform:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.vars.outputs.image_tag }}
            ${{ vars.ACR_NAME }}.azurecr.io/log-anomaly-platform:latest

  deploy-container-apps-canary:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install azure-identity azure-monitor-query

      # First, deploy the new revision with a suffix derived from the commit SHA
      - name: Deploy new revision
        run: |
          az containerapp update --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image ${{ needs.build-and-push.outputs.image_tag }} \
            --revision-suffix ${{ github.sha }}

      # Then run the REAL canary rollout — progressive traffic shift,
      # gated on a live Application Insights failure-rate query, with
      # automatic rollback if the new revision misbehaves. This is the
      # piece Project 3 left as a documented stub; here it's wired for real.
      - name: Canary rollout with live failure-rate gating
        run: |
          python deploy/canary_rollback.py \
            --app-name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --new-revision-suffix ${{ github.sha }} \
            --app-insights-app-id ${{ vars.LOG_ANALYTICS_WORKSPACE_ID }} \
            --failure-threshold-pct 5.0

  deploy-huggingface-space:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push app/ to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python -c "
          from huggingface_hub import HfApi
          api = HfApi(token='${HF_TOKEN}')
          api.upload_folder(
              folder_path='app',
              repo_id='${{ vars.HF_SPACE_ID }}',
              repo_type='space',
              commit_message='Deploy ${{ github.sha }}',
          )
          "
